server:
  port: 8080

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:justchat}
    username: ${DB_USER:justchat}
    password: ${DB_PASSWORD:justchat}
  jpa:
    hibernate:
      # ddl-auto=update is fine for this take-home's time-box. In a real project this would be Flyway/Liquibase migrations instead.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  sql:
    init:
      # Runs schema.sql on every start (default is embedded DBs only) - see that file.
      mode: always

logging:
  level:
    com.justchat: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      # Adds an "application" label to every metric
      application: justchat
    distribution:
      percentiles-histogram:
        # Needed for p95/p99 latency in Grafana
        "[http.server.requests]": true
