server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - any unmatched path serves index.html so client-side routing (if we
    # had any) and plain refreshes on a deep link don't 404.
    location / {
        try_files $uri /index.html;
    }

    # Serving the frontend and proxying the API from the same origin is what lets us
    # sidestep the CORS + credentialed-cookie complexity entirely in production - the
    # browser sees one origin for everything, cookies just work.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # WebSocket upgrade requires these two headers explicitly - nginx doesn't forward the
    # Upgrade handshake by default the way a plain HTTP proxy_pass does.
    location /ws/ {
        proxy_pass http://backend:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
